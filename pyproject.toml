[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pif-firewall"
version = "0.1.0"
description = "Agent Security Gateway: a prompt injection firewall with detection + tool-call containment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
parsers = ["beautifulsoup4>=4.12", "python-docx>=1.1"]
judge = ["openai>=1.0"]
ml = ["scikit-learn>=1.3"]  # training only; inference has no ML dependency
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
